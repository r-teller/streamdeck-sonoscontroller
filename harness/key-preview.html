<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stream Deck Key/Encoder Preview</title>
  <style>
    body {
      margin: 0;
      padding: 16px;
      background-color: #1a1a1a;
      font-family: sans-serif;
      color: #fff;
    }
    #tiles {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      margin-top: 16px;
    }
    .tile {
      position: relative;
      background-color: #000;
      box-sizing: border-box;
    }
    .key-tile {
      width: 72px;
      height: 72px;
    }
    .encoder-tile {
      width: 200px;
      height: 100px;
    }
    .tile img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }
    .tile-title {
      position: absolute;
      color: #fff;
      font-size: 11px;
      font-family: sans-serif;
      text-shadow: 0 1px 2px #000;
      white-space: pre-line;
      text-align: center;
      overflow: hidden;
      text-overflow: ellipsis;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
    }
    .tile-state {
      position: absolute;
      top: 2px;
      left: 2px;
      background-color: #444;
      color: #fff;
      font-size: 9px;
      padding: 1px 3px;
      border-radius: 2px;
    }
    .tile-alert {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: rgba(255, 165, 0, 0.3);
      font-size: 24px;
      pointer-events: none;
    }
    .encoder-title {
      position: absolute;
      color: #fff;
      font-size: 16px;
      font-weight: 600;
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .encoder-value {
      position: absolute;
      color: #fff;
      font-size: 24px;
      text-align: right;
    }
    .encoder-icon {
      position: absolute;
    }
    .encoder-indicator {
      position: absolute;
    }
    .encoder-indicator-bar {
      position: absolute;
      background-color: #00ff00;
      height: 100%;
    }
    .encoder-indicator-gbar {
      position: absolute;
      background: linear-gradient(to right, #ff0000 0%, yellow 50%, #00ff00 100%);
      height: 100%;
    }
    .encoder-indicator-needle {
      position: absolute;
      width: 2px;
      background-color: #000;
      height: 100%;
      top: 0;
    }
    .tile-caption {
      margin-top: 8px;
      font-size: 12px;
      color: #aaa;
    }
    .tile-wrap { display: flex; flex-direction: column; align-items: center; }
  </style>
</head>
<body>
  <h1>Key/Encoder Preview</h1>
  <div id="tiles"></div>
  <script type="module" src="./preview.js"></script>
</body>
</html>
