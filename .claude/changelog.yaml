      - "added: src/modules/common/sonosErrors.js — SonosError class (category + context) + translateSonosError({op, host, port, timeoutSec}) helper. Translation rules cover timeout/network/fault/http/parse + the PR #3 safety net (TypeError 'is not iterable' / 'Cannot read prop')."
      - "changed: refactored Phase 1 modules from code review pass — streamdeck.js now uses addEventListener pattern with onerror/onclose handlers + cached actionInfo for late subscribers; constructor takes options object (drops Hungarian inX prefix); defensive JSON.parse via safeJsonParse. timers.js Worker.onmessage attached once (was reassigned per call); Math.max(0, delay) properly clamps; Map/Set replace plain object/array. xml.js throws XmlParseError on malformed input (was returning garbage); numeric nodeType literals → named constants."
