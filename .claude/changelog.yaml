      - "added: SonosController.getFavorites() — Browse FV:2 with verbatim Sonos arg set, parses embedded DIDL-Lite payload, returns one record per favorite per data-model.md §Shape: Favorite (title/uri/metadata/albumArtURI). Metadata preserves single-unescaped DIDL-Lite for verbatim re-submission."
      - "added: src/modules/common/coordinatorResolver.js — resolveCoordinator(speakerUuid, topology) walks ZoneGroups → ZoneGroupMember → Satellite to find the coordinator UUID for the bound speaker's group. Pure function. Throws SonosError(category=unknown) when speaker missing from topology (loud-fail per cel spike Q2 contract)."
      - "added: SonosController.getHostByUuid(topology, uuid) static — companion lookup that returns a device's host from its UUID, used by transport routing to find the coord's address after resolveCoordinator."
