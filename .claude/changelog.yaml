      - "added: src/pi/main.js wired to PiComponent (was Placeholder); src/scss/styles.scss imports Bootstrap 5."
      - "added: plugin.html + pi.html with connectElgatoStreamDeckSocket hook exposing window.\\$SD."
    infra:
