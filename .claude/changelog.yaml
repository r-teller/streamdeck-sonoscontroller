# Changelog — structured session log
# Each entry is one session/branch. Newest first.
# gogogo reads entries[0]; wrapup prepends to the top of entries[].
# Each area bullet is prefixed with added:|changed:|fixed: to indicate change type.
#
# Version Numbering (SemVer):
#   MAJOR (X.0.0) — incompatible / breaking API changes
#   MINOR (0.X.0) — new features, backwards-compatible
#   PATCH (0.0.X) — bug fixes, minor improvements
#   MVP: use 0.x.x while iterating; bump to 1.0.0 when core features are stable
#
# IMPORTANT: Always quote commit hashes — e.g. ["abc1234"] not [abc1234].

template_entry:
  version: "0.X.Y"
  date: "YYYY-MM-DD"
  branch: "feature/work-YYYYMMDD-HHMM-short-description"
  focus: [feature, bugfix, refactor, infrastructure, documentation, stabilization]
  summary: "One-line summary of the session's work"
  beads: [bead-id-1, bead-id-2]
  epic_progress: "epic-id XX% → YY%"
  backend:
    - "added: Models/API/service changes"
  frontend:
    - "changed: Pages/components/UX changes"
  infra:
    - "added: Migrations, config, tooling, CI changes"
  docs:
    - "added: Context docs, commands, workflow changes"
  tests: "N new/updated, M total passing"
  commits: ["abc1234", "def5678"]

entries:
  - version: "0.1.0"
    date: "2026-05-03"
    branch: "rebuild-from-prd"
    focus: [feature, infrastructure, documentation]
    summary: "Phase 1 (Build & Scaffolding) complete: LICENSE, hygiene, SDK compat spike, vite + manifest + WS client + XML parser + timer shim + assets + PI shell + device spike. Project bootable end-to-end."
    beads:
      - streamdeck-sonoscontroller-buu
      - streamdeck-sonoscontroller-4kb.7
      - streamdeck-sonoscontroller-8ss
      - streamdeck-sonoscontroller-4kb.1
      - streamdeck-sonoscontroller-4kb.5
      - streamdeck-sonoscontroller-4kb.6
      - streamdeck-sonoscontroller-4kb.4
      - streamdeck-sonoscontroller-4kb.3
      - streamdeck-sonoscontroller-4kb.2
      - streamdeck-sonoscontroller-orw.1
      - streamdeck-sonoscontroller-cbz
    epic_progress: "4kb 0% → 100% (auto-closed); orw 0% → 15%"
    backend:
      - "added: src/modules/common/streamdeck.js — hand-rolled WebSocket client extending EventEmitter, registration handshake, full event re-emit table, outgoing helpers. Fixes main's sendToPlugin bug (action UUID was conflated with propertyInspectorUUID)."
      - "added: src/modules/common/xml.js — convertXmlToJson + asArray helpers. Single-child returns as object/string, multi-sibling collapses to array. Empty element returns ''. Attributes under _attributes."
      - "added: src/modules/common/timers.js — Web Worker–backed setTimeout/setInterval shim. Survives Stream Deck app focus loss. Vitest fallback when Worker is undefined."
    frontend:
