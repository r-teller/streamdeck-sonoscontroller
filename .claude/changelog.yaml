      - "added: .gitignore merged with main's Node-flavored ignores + preserved .dolt + *.db."
      - "added: .eslintrc.cjs (Vue 3 essential + Prettier passthrough), .prettierrc (printWidth 128), .prettierignore, package.json (type: module, full dep manifest, 9 vestigial deps dropped: axios/sonos/js-yaml/nunjucks/snapsvg-cjs/fs/core-js/@mdi/font/@mdi/js, plus babel-eslint)."
      - "added: vite.config.js multi-entry (plugin.html + pi.html → com.r-teller.sonoscontroller.sdPlugin/), Vue plugin, path aliases (@, ~bootstrap, @manifest), base ./."
      - "added: jsconfig.json with @ → src alias for editor IntelliSense."
      - "added: public/manifest.json with all 11 actions + Software.MinimumVersion 6.5 + OS macOS 10.11+ / Windows 10+ + Nodejs 20. Five corrections vs main: Toggle Input Source tooltip rewritten, Volume Up/Down tooltips trimmed, Encoder layout default → encoder-bar-0-100.json, Version → 0.1.0.0."
      - "added: public/layouts/{encoder-audio-equalizer,encoder-bar-0-100,encoder-gbar-10-10}.json (verbatim from main)."
      - "added: material-design-icons git submodule (outlined variant), generateImages.sh (cleaned with set -euo pipefail, 30 lines of dead code removed)."
