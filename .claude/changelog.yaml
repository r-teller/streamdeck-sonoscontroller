      - "added: src/modules/common/sonosController.js — wraps a single host with the six UPnP service endpoints (audioIn/avTransport/deviceProperties/renderingControl/zoneGroupTopology/contentDirectory) verbatim per backend.md. Memoizes ZoneGroupState. Threads timeoutSec into all service calls."
